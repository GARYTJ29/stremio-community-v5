# Socket path (leave empty for auto)
socket=

# Thumbnail path (leave empty for auto)
thumbnail=

# Maximum thumbnail generation size in pixels (scaled down to fit)
# Values are scaled when hidpi is enabled
max_height=90
max_width=160

# Scale factor for thumbnail display size (requires mpv 0.38+)
# Note that this is lower quality than increasing max_height and max_width
scale_factor=1

# Apply tone-mapping, no to disable
tone_mapping=auto

# Overlay id
overlay_id=42

# Spawn thumbnailer on file load for faster initial thumbnails
spawn_first=no

# Close thumbnailer process after an inactivity period in seconds, 0 to disable
quit_after_inactivity=0

# Enable on network playback
network=yes

# Enable on audio playback
audio=no

# Hardware decoding for the thumbnail mpv. Off: a second NVDEC session seeking
# across a 4K AV1 stream faults nvcuvid.dll, and 160x90 frames are cheap in
# software anyway.
hwdec=no

# Windows only: use native Windows API to write to pipe (requires LuaJIT)
direct_io=no

# Custom path to the mpv executable
mpv_path=portable_config/mpv/mpv.exe

# --- Timeline thumbnail cache (fork addition) --------------------------------
# Upstream thumbfast decodes a fresh frame for every hover, so hovering a region
# always costs a seek + decode (and, on a network stream, a download). These
# options add a coarse cache built across the whole timeline in the background,
# so a hover shows an instant approximate frame while the exact one is fetched.

# Enable the timeline cache. Set to no for upstream behaviour (every hover decodes
# a fresh frame, nothing is cached).
cache_enabled=yes

# How many thumbnails to spread across the timeline. The video is divided into this
# many equal segments and one frame is cached per segment, so at 20 there is a
# cached frame every 5% of the duration -- for a 2h film, one every 6 minutes.
# Higher means finer placeholders but more seeking/downloading up front.
cache_thumbnails=20

# Seconds after file load before the background pass starts, so it does not
# fight the player for bandwidth while playback is still buffering
cache_prebuild_delay=5

# Rough bandwidth budget for the background pass, in megabits per second.
# NOTE: mpv has no download rate limiter, so this is NOT a hard cap. It is enforced
# by pacing -- after each fetch the pass waits in proportion to how long that fetch
# took and how much faster the stream is than this budget. On a 4K stream that makes
# prebuilding very slow or effectively idle, which is the intended trade: playback
# gets the link, previews fall back to decoding on hover. 0 disables pacing.
cache_bandwidth_mbps=1

# Never fetch a background frame while the player's own buffer is below this many
# seconds. This is the real protection against starving playback, since it reacts to
# actual buffer health rather than to a guessed rate.
cache_min_buffer_secs=20

# Seconds of hover inactivity before the background pass resumes
cache_idle_delay=0.75

# Give up on one background cache frame after this many seconds
cache_timeout=20

# How many times to retry a timed-out cache entry before giving up on it
cache_attempts=2
