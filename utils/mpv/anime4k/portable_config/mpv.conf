# Optimized shaders for higher-end GPU: Mode A (HQ)
# glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"

# Offsets Text from the top
osd-margin-y=50

# No log-file here on purpose: DEBUG_LOG in script-opts/svp.conf controls it at runtime.

# NVIDIA RTX Video HDR. d3d11vpp emits PQ/BT.2020 but leaves the frame tagged as
# the source colorspace, so the `format` entry relabels it for the VO.
# profile-manager.lua keeps unlabelled filters from this file across its per-file
# reset, and flips the output to HDR when it sees nvidia-true-hdr here.
# For RTX Super Resolution instead, swap the first entry for:
vf=d3d11vpp=scale=2:scaling-mode=nvidia
# vf=d3d11vpp=nvidia-true-hdr:format=p010,format=colormatrix=bt.2020-ncl:primaries=bt.2020:gamma=pq
# vf=d3d11vpp=nvidia-true-hdr:format=p010,format=colormatrix=bt.2020-ncl:primaries=bt.2020:gamma=pq:colorlevels=full
