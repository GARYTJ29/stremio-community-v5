# smart_track_selector.conf
# Configuration file for scripts/smart-track-selector/main.lua v1.7.0
# Place this file in: /portable_config/script-opts/smart_track_selector.conf

#==============================================================================
#                                  HOW THIS WORKS
#==============================================================================

# Almost nothing here needs to be set. webmods/notify-skip-bridge/mpv-bridge.js
# pushes a `track-selector-config` script-message on every player route, built
# from Stremio's own Player settings (Default Audio/Subtitle Track, Subtitle
# Priority Keywords, Selection Mode, Remember Track Selection) and from the
# Smart Tracks rows that webmods/Settings/mpv-settings.js adds. Those values
# overwrite the ones below and trigger a re-selection, so the entries here only
# cover the window before the bridge's first message arrives -- a direct mpv
# launch, or the first frames of a file loaded before the page is ready.
#
# Set a language list here only if you want a sane fallback for that window.
# Anything you put here is discarded as soon as the bridge speaks.
#
# All lists are comma-separated and case-insensitive for ASCII. Non-ASCII
# keywords (Cyrillic, Japanese) match case-sensitively -- list each variant.

#==============================================================================
#                              SUBTITLE SETTINGS
#==============================================================================

# Preferred subtitle languages, best first. Codes or names both work.
# Bridged from Stremio's "Default Subtitle Track".
#sub_preferred_langs=en,eng,english

# Tracks whose title contains these are preferred within the same language.
# Bridged from Stremio's "Subtitle Priority Keywords".
#sub_priority_keywords=full,dialogue

# Tracks whose title contains these are never auto-selected.
# Bridged from "Subtitle Reject Keywords" in Settings.
#sub_reject_keywords=sign,song,karaoke,commentary,op,ed,credit

# Subtitle languages that are never auto-selected.
# Bridged from "Rejected Subtitle Languages" in Settings.
#sub_reject_langs=

#==============================================================================
#                                AUDIO SETTINGS
#==============================================================================

# Preferred audio languages, best first.
# Bridged from Stremio's "Default Audio Track".
#audio_preferred_langs=en,eng,english

# Audio tracks whose title contains these are never auto-selected.
# Bridged from "Audio Reject Keywords" in Settings.
#audio_reject_keywords=commentary,descriptive,audio description,visually impaired

# Audio languages that are never auto-selected.
# Bridged from "Rejected Audio Languages" in Settings.
#audio_reject_langs=

#==============================================================================
#                                   BEHAVIOR
#==============================================================================

# Master switch. When off the script selects nothing and defends nothing --
# audio and subtitle tracks are left to mpv's own defaults and to whatever the
# Stremio player picks. Bridged from "Smart Track Selection" in Settings, so
# this line only decides how the very first file behaves before the page loads.
#enabled=yes

# Prefer audio matching the video track's language tag, so a title plays in its
# original language without listing every language it could be.
# Bridged from "Match Audio to Video" in Settings.
#match_audio_to_video=no

# When the selected audio language matches a forced subtitle's language, select
# that forced sub -- foreign dialogue and on-screen text stay translated.
# Bridged from "Use Forced Subs for Native Audio" in Settings.
#use_forced_for_native=no

# Per-track scoring detail in mpv's console (`). The script's in-code default is
# on, so this has to be set explicitly to keep the log quiet.
debug_logging=no
